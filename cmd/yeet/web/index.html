{{define "index.html"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yeet</title>
<style>
  :root { color-scheme: light dark; --field-bg: #fff; --field-fg: #111; }
  @media (prefers-color-scheme: dark) { :root { --field-bg: #1c1c1c; --field-fg: #eee; } }
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1.25rem; }
  h1 { font-size: 1.4rem; margin-bottom: 0; }
  .sub { color: #888; margin-top: .15rem; margin-bottom: 2rem; }
  fieldset { border: 1px solid #8883; border-radius: 6px; padding: 1rem; margin-bottom: 1.5rem; }
  legend { padding: 0 .4rem; }
  label { display: block; font-size: .85rem; margin: .6rem 0 .2rem; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; border: 1px solid #8886; border-radius: 4px; background: var(--field-bg); color: var(--field-fg); }
  select option { background: var(--field-bg); color: var(--field-fg); }
  textarea { min-height: 8rem; font-family: ui-monospace, monospace; font-size: .85rem; }
  button { padding: .55rem 1.1rem; font: inherit; border: none; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .type-panel { display: none; }
  .type-panel.active { display: block; }
  #advanced { border: 1px solid #8883; border-radius: 6px; padding: .6rem 1rem; margin-top: 1rem; }
  #advanced summary { cursor: pointer; font-size: .85rem; }
  #advanced[disabled] { opacity: .5; pointer-events: none; }
  #result { margin-top: 1rem; padding: .75rem; border-radius: 4px; display: none; }
  #result.ok { display: block; background: #16a34a22; border: 1px solid #16a34a55; }
  #result.err { display: block; background: #dc262622; border: 1px solid #dc262655; }
  #result a { font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
  td, th { text-align: left; padding: .4rem .3rem; border-bottom: 1px solid #8883; font-size: .85rem; }
  .row-actions button { padding: .25rem .55rem; font-size: .8rem; margin-right: .3rem; background: #6b728033; color: inherit; }
  .row-actions button.danger { background: #dc262633; }
  .expand-btn { background: none; border: none; padding: 0 .4rem 0 0; cursor: pointer; color: inherit; font-size: .8rem; display: inline-block; transition: transform 150ms ease-out; }
  .expand-btn.open { transform: rotate(90deg); }
  .item-name { font-weight: 600; }
  a.item-name { color: #2563eb; text-decoration: none; }
  a.item-name:hover { text-decoration: underline; }
  .status-badge { display: inline-block; padding: .1rem .5rem; border-radius: 3px; font-size: .75rem; }
  .status-running { background: #16a34a22; color: #16a34a; }
  .status-exited { background: #6b728033; color: #888; }
  .status-other { background: #d9770622; color: #d97706; }
  .detail-row td { border-bottom: 1px solid #8883; padding: 0 .3rem .6rem 1.7rem; font-size: .8rem; color: #999; }
  .detail-row[hidden] { display: none; }
  .detail-row a { color: #2563eb; }
</style>
</head>
<body>
<h1>yeet</h1>
<p class="sub">hey {{.Who}} — deploy something to *.{{.BaseDomain}}</p>

<form id="deploy-form">
  <label>Type</label>
  <select id="type" name="type">
    <option value="github">Private GitHub repo</option>
    <option value="public">Public git repo</option>
    <option value="dockerfile">Dockerfile</option>
    <option value="compose">docker-compose</option>
  </select>

  <div class="type-panel" data-type="github">
    <label>Repository (owner/repo)</label>
    <input name="repository" placeholder="jcsawyer123/some-project">
    <label>Branch</label>
    <input name="branch" placeholder="main">
    <label>Port</label>
    <input name="port" placeholder="8080">
  </div>

  <div class="type-panel" data-type="public">
    <label>Git URL</label>
    <input name="repository" placeholder="https://github.com/someone/project">
    <label>Branch</label>
    <input name="branch" placeholder="main">
    <label>Port</label>
    <input name="port" placeholder="8080">
  </div>

  <div class="type-panel" data-type="dockerfile">
    <label>Dockerfile contents</label>
    <textarea name="dockerfile" placeholder="FROM ..."></textarea>
    <label>Port</label>
    <input name="port" placeholder="8080">
  </div>

  <div class="type-panel" data-type="compose">
    <label>docker-compose.yml contents</label>
    <textarea name="compose" placeholder="services:&#10;  app:&#10;    image: ..."></textarea>
  </div>

  <label>Name (optional — random if left blank)</label>
  <input name="name" placeholder="leave blank to auto-generate">

  <details id="advanced">
    <summary>Advanced</summary>
    <label style="display:flex; align-items:center; gap:.4rem; margin-top:.6rem">
      <input type="checkbox" name="health_check_enabled" id="health-check-enabled" style="width:auto">
      Enable health check
    </label>
    <label>Health check path</label>
    <input name="health_check_path" id="health-check-path" placeholder="/healthz" disabled>

    <label>Stop after (minutes, optional)</label>
    <input name="ttl_minutes" placeholder="e.g. 60 for 1 hour">

    <label>Reset every (minutes, optional)</label>
    <input name="reset_interval_minutes" placeholder="e.g. 1440 for daily">

    <label style="display:flex; align-items:center; gap:.4rem; margin-top:.6rem">
      <input type="checkbox" name="expiry_delete" id="expiry-delete" style="width:auto">
      Delete instead of stop when the timer expires
    </label>

    <p style="font-size:.75rem; color:#888; margin:.4rem 0 0">Health checks and stop/reset timers aren't applied to docker-compose deploys.</p>
  </details>

  <div style="margin-top:1rem">
    <button type="submit">Deploy</button>
  </div>
</form>

<div id="result"></div>

<h2 style="margin-top:2.5rem; font-size:1.1rem">Your deployments</h2>
<table id="list"><tbody></tbody></table>

<script>
const panels = document.querySelectorAll(".type-panel");
const typeSel = document.getElementById("type");
const advanced = document.getElementById("advanced");
const healthCheckEnabled = document.getElementById("health-check-enabled");
const healthCheckPath = document.getElementById("health-check-path");
const policyFields = document.querySelectorAll('[name="ttl_minutes"], [name="reset_interval_minutes"], [name="expiry_delete"]');

function syncPanels() {
  panels.forEach(p => {
    const active = p.dataset.type === typeSel.value;
    p.classList.toggle("active", active);
    // disabled fields are excluded from FormData - without this, hidden
    // panels' empty inputs (duplicate names like "repository"/"port")
    // silently overwrite the active panel's values on submit.
    p.querySelectorAll("input, textarea").forEach(el => { el.disabled = !active; });
  });
  // health checks and stop/reset policy aren't wired up for docker-compose deploys
  const composeSelected = typeSel.value === "compose";
  advanced.toggleAttribute("disabled", composeSelected);
  healthCheckEnabled.disabled = composeSelected;
  healthCheckPath.disabled = composeSelected || !healthCheckEnabled.checked;
  policyFields.forEach(el => { el.disabled = composeSelected; });
}
typeSel.addEventListener("change", syncPanels);
healthCheckEnabled.addEventListener("change", syncPanels);
syncPanels();

document.getElementById("deploy-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  const result = document.getElementById("result");
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  body.health_check_enabled = fd.has("health_check_enabled");

  const ttlMinutes = parseInt(body.ttl_minutes, 10);
  const resetMinutes = parseInt(body.reset_interval_minutes, 10);
  delete body.ttl_minutes;
  delete body.reset_interval_minutes;
  delete body.expiry_delete;
  if (Number.isFinite(ttlMinutes) && ttlMinutes > 0) body.ttl_seconds = ttlMinutes * 60;
  if (Number.isFinite(resetMinutes) && resetMinutes > 0) body.reset_interval_seconds = resetMinutes * 60;
  if (body.ttl_seconds || body.reset_interval_seconds) {
    body.expiry_action = fd.has("expiry_delete") ? "delete" : "stop";
  }

  btn.disabled = true;
  result.className = "";
  result.textContent = "";

  try {
    const res = await fetch("/api/deploy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    result.className = "ok";
    result.innerHTML = `Deployed: <a href="${data.url}" target="_blank">${data.url}</a>`;
    loadList();
  } catch (err) {
    result.className = "err";
    result.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
  }
});

function statusClass(status) {
  const state = (status || "").split(":")[0];
  if (state === "running") return "status-running";
  if (state === "exited" || state === "stopped") return "status-exited";
  return "status-other";
}

// "state:unknown" means no health check is configured - showing "unknown"
// reads as something being wrong when nothing is; just show the state.
function statusText(status) {
  const [state, health] = (status || "").split(":");
  return health === "unknown" ? state : status;
}

function relativeMinutes(isoString) {
  const diffMs = new Date(isoString).getTime() - Date.now();
  const mins = Math.round(diffMs / 60000);
  if (mins <= 0) return "any moment";
  if (mins < 60) return mins + "m";
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + "h " + (mins % 60) + "m";
  return Math.floor(hours / 24) + "d " + (hours % 24) + "h";
}

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  });
  children.forEach(c => node.appendChild(c));
  return node;
}

async function loadList() {
  const res = await fetch("/api/list");
  const items = await res.json();
  const tbody = document.querySelector("#list tbody");
  tbody.innerHTML = "";

  (items || []).forEach(item => {
    const base = item.kind === "application" ? "/api/apps/" : "/api/services/";

    const expandBtn = el("button", { class: "expand-btn", type: "button", "aria-label": "toggle details" });
    expandBtn.textContent = "▸";

    const nameCell = document.createElement("td");
    nameCell.appendChild(expandBtn);
    if (item.url) {
      nameCell.appendChild(el("a", { class: "item-name", href: item.url, target: "_blank", rel: "noopener", text: item.name }));
    } else {
      nameCell.appendChild(el("span", { class: "item-name", text: item.name }));
    }

    const statusCell = document.createElement("td");
    if (item.status) {
      statusCell.appendChild(el("span", { class: "status-badge " + statusClass(item.status), text: statusText(item.status) }));
    }
    if (item.expires_at) {
      statusCell.appendChild(document.createTextNode(" "));
      statusCell.appendChild(el("span", { class: "status-badge status-other", text: "stops in " + relativeMinutes(item.expires_at) }));
    }
    if (item.next_reset_at) {
      statusCell.appendChild(document.createTextNode(" "));
      statusCell.appendChild(el("span", { class: "status-badge status-other", text: "resets in " + relativeMinutes(item.next_reset_at) }));
    }

    const actionsCell = el("td", { class: "row-actions" },
      el("button", { "data-action": "stop", text: "stop" }),
      el("button", { "data-action": "start", text: "start" }),
      el("button", { "data-action": "delete", class: "danger", text: "delete" }),
    );

    const tr = el("tr", {}, nameCell, statusCell, el("td", { text: item.kind }), actionsCell);

    const detailParts = [];
    if (item.git_repository) detailParts.push(el("div", { text: "Repository: " + item.git_repository }));
    if (item.dashboard_url) detailParts.push(el("div", {}, el("a", { href: item.dashboard_url, target: "_blank", rel: "noopener", text: "Open in Coolify →" })));
    if (detailParts.length === 0) detailParts.push(el("div", { text: "No additional details" }));
    const detailTd = el("td", { colspan: "4" }, ...detailParts);
    const detailRow = el("tr", { class: "detail-row", hidden: "" }, detailTd);

    expandBtn.addEventListener("click", () => {
      const open = expandBtn.classList.toggle("open");
      detailRow.hidden = !open;
      expandBtn.textContent = open ? "▾" : "▸";
    });

    tr.querySelectorAll("button[data-action]").forEach(b => {
      b.addEventListener("click", async () => {
        const action = b.dataset.action;
        const method = action === "delete" ? "DELETE" : "POST";
        const path = action === "delete" ? base + item.uuid : base + item.uuid + "/" + action;
        await fetch(path, { method });
        loadList();
      });
    });

    tbody.appendChild(tr);
    tbody.appendChild(detailRow);
  });
}
loadList();
</script>
</body>
</html>
{{end}}
